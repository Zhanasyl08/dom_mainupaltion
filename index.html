<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5 - JavaScript Basics</title>
</head>
<body>
    <h1>Assignment 5 - JavaScript Basics</h1>
    <h2>Part 1: Profile Object and Calculations</h2>
    <p id="profileInfo"></p>
    <p id="ageInfo"></p>

    <h2>Part 2: Update Profile</h2>
    <form id="profileForm">
        <label for="username">Username:</label>
        <input type="text" id="username" required>
        <label for="birthYear">Birth Year:</label>
        <input type="number" id="birthYear" min="1900" required>
        <button type="submit">Create / Update Profile</button>
    </form>

    <h2>Part 3: Hobbies List</h2>
    <ul id="hobbiesList"></ul>
    <input type="text" id="newItem" placeholder="New hobby">
    <button id="addButton" type="button">Add Item</button>
    <button id="removeButton" type="button">Remove Item</button>

    <script src="script.js"></script>
</body>
</html>
